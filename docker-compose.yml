version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidentiq-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./incidentiq.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=SECRET_DEV_KEY_INCIDENTIQ_SUPER_SAFE_CHANGE_IN_PROD_12345
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidentiq-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: incidentiq-redis
    restart: always
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: incidentiq-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
